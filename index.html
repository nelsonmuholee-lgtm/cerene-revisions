<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CERENE Révisions — Objectif Brevet</title><style>
:root{--bg:#f5f7fb;--paper:#fff;--ink:#203047;--muted:#526277;--accent:#6255b6;--border:#d9e2ee;--good:#166a4b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.65 Arial,sans-serif}body.dys{font-family:Verdana,Arial,sans-serif;letter-spacing:.07em;word-spacing:.16em;line-height:1.95}body.dark{--bg:#182434;--paper:#243348;--ink:#f5f7ff;--muted:#d4e0ee;--accent:#9acaff;--border:#52647c;--good:#a2efc8}body.large{font-size:21px}header{background:#f9f8ff;color:#303039;border-bottom:5px solid #9587dd;padding:22px max(20px,calc((100vw - 1050px)/2))}header h1{margin:0;font-size:1.8rem}header p{margin:0;color:#4c5266}main{max-width:1050px;margin:auto;padding:22px}nav,.toolbar,.actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}button{font:inherit;border:2px solid var(--border);border-radius:12px;padding:10px 15px;background:var(--paper);color:var(--ink);cursor:pointer}button:focus-visible{outline:4px solid #f0b744;outline-offset:2px}button.primary,.selected{background:var(--accent);color:#102034;border-color:var(--accent)}body:not(.dark) button.primary,body:not(.dark) .selected{color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px}.card,.panel{background:var(--paper);border:1px solid var(--border);border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 3px 12px #1020400b}.card h3{margin:0 0 7px}.card p{color:var(--muted)}.tag{font-size:.82em;color:var(--muted)}.question{font-weight:bold;font-size:1.15em}.answers{display:grid;gap:10px}.answers button{text-align:left}.feedback{padding:12px;border-left:5px solid var(--accent);margin-top:12px;background:var(--bg)}.hidden{display:none!important}footer{padding:25px;text-align:center;color:var(--muted)}progress{width:100%;height:20px;accent-color:#247b62}ul{padding-left:1.5em}li{margin:7px 0}#content{min-height:250px} .skip{position:absolute;left:-9999px}.skip:focus{left:10px;top:10px;background:white;padding:10px;z-index:10} @media(max-width:600px){header h1{font-size:1.45rem}main{padding:12px}.card,.panel{padding:16px}}
.brand{display:flex;align-items:center;gap:24px;flex-wrap:wrap}.brand-logo{display:block;width:190px;max-width:42vw;height:auto;object-fit:contain}body.dark header{background:#243348;color:#f5f7ff}body.dark header p{color:#d4e0ee}@media(max-width:600px){.brand{gap:12px}.brand-logo{width:145px}}

/* Correction explicite et accessible */
.answers button.wrong-answer{border:3px solid #b42318!important;background:#fff0ee!important;color:#8f1d14!important;font-weight:bold}
.answers button.correct-answer{border:3px solid #16724c!important;background:#e5f7ed!important;color:#105c3d!important;font-weight:bold}
.feedback.incorrect{border-left:6px solid #b42318;background:#fff0ee;color:#8f1d14}
.feedback.correct{border-left:6px solid #16724c;background:#e5f7ed;color:#105c3d}
body.dark .feedback.incorrect,body.dark .answers button.wrong-answer{background:#511d24!important;color:#fff1f0!important}
body.dark .feedback.correct,body.dark .answers button.correct-answer{background:#164631!important;color:#effff4!important}
.lesson-tip{border-left:5px solid #9587dd;padding:12px;background:var(--bg);border-radius:8px}

/* Textes à trous : sélection dans la phrase, sans glisser-déposer */
.blank-select{display:inline-block;max-width:100%;min-width:150px;padding:9px 12px;border:3px solid #6255b6;border-radius:10px;background:white;color:#203047;font:inherit;vertical-align:middle}
.blank-select.correct-answer{border-color:#16724c;background:#e5f7ed;color:#105c3d}
.blank-select.wrong-answer{border-color:#b42318;background:#fff0ee;color:#8f1d14}
.blank-sentence{font-size:1.15em;line-height:2.4;padding:15px;border-radius:12px;background:var(--bg)}
body.dark .blank-select{background:#243348;color:#fff}
body.dark .blank-select.wrong-answer{background:#511d24;color:#fff}
body.dark .blank-select.correct-answer{background:#164631;color:#fff}
/* Activités guidées : accessibles sans glisser-déposer */
.activity-option{display:block;width:100%;text-align:left;margin:9px 0}.activity-option[disabled]{opacity:1}.activity-option.correct-answer{border:3px solid #13834f;background:#e1f7eb;color:#104c32}.activity-option.wrong-answer{border:3px solid #b42332;background:#ffe4e6;color:#8b1525}.activity-feedback{padding:16px;margin:16px 0;border-radius:12px;border:2px solid}.activity-feedback.correct{background:#e1f7eb;color:#104c32;border-color:#13834f}.activity-feedback.incorrect{background:#ffe4e6;color:#8b1525;border-color:#b42332}body.dark .activity-feedback.correct,body.dark .activity-option.correct-answer{background:#153d30;color:#eafff2}body.dark .activity-feedback.incorrect,body.dark .activity-option.wrong-answer{background:#4b202a;color:#ffe7eb}.activity-text{font-size:1.12em;font-weight:600}.activity-panel{max-width:760px} .activity-help{border-left:5px solid var(--accent);padding:12px;background:var(--bg)}

/* Version 8 — modules supplémentaires sans modifier les activités existantes */
.v8-kicker{font-size:.84em;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.045em}
.v8-callout{background:var(--paper);border:2px solid var(--accent);border-radius:18px;padding:22px;margin:20px 0}
.v8-document{white-space:pre-line;line-height:1.9;background:var(--bg);border-left:5px solid var(--accent);border-radius:8px;padding:18px;margin:16px 0}
.v8-meta{color:var(--muted);font-size:.92em}.v8-pill{display:inline-block;background:var(--bg);border:1px solid var(--border);border-radius:50px;padding:4px 12px;margin:4px}
.v8-review{border-left:5px solid #b45309;background:var(--bg);padding:14px;margin-top:12px;border-radius:10px}
.v8-good{border-left-color:#16724c}.v8-score{font-size:1.35em;font-weight:700}.v8-summary{margin-top:16px}
.v8-question-separator{border-top:1px solid var(--border);margin:14px 0}.v8-button-row{display:flex;gap:10px;flex-wrap:wrap}
.v8-input{width:100%;border:2px solid var(--border);border-radius:9px;padding:12px;font:inherit;background:var(--paper);color:var(--ink)}


/* Version 9 - Mon cours, mes révisions */
.v9-box{border:2px solid var(--border);border-radius:16px;padding:18px;margin:16px 0;background:var(--paper)}
.v9-label{display:block;font-weight:bold;margin:12px 0 5px}.v9-textarea,.v9-input{width:100%;padding:12px;border:2px solid var(--border);border-radius:10px;background:var(--paper);color:var(--ink);font:inherit}
.v9-textarea{min-height:210px;resize:vertical}.v9-note{font-size:.9em;color:var(--muted)}.v9-fiche li{margin-bottom:13px}.v9-source{border-left:4px solid var(--accent);padding:12px;background:var(--bg);white-space:pre-wrap;overflow-wrap:anywhere}.v9-question{border:1px solid var(--border);border-radius:12px;padding:16px;margin:14px 0}.v9-question .answers{margin-top:12px}.v9-callout{border:2px solid #7a6abf;background:var(--paper);padding:20px;border-radius:18px;margin:18px 0}

/* Version 10 : accès partageable et entraînement ciblé */
.v10-callout{border:2px solid #8d80d9;background:var(--paper);border-radius:18px;padding:20px;margin:18px 0}.v10-callout h2{margin-top:5px}.v10-small{font-size:.93em;color:var(--muted)}.v10-toolbar{display:flex;gap:10px;flex-wrap:wrap}.v10-note{border-left:5px solid var(--accent);padding:12px;background:var(--bg);border-radius:8px}.v10-chip{display:inline-block;padding:4px 10px;margin:4px;border-radius:20px;background:var(--bg);border:1px solid var(--border)}.v10-list{display:grid;gap:12px}.v10-list article{border:1px solid var(--border);border-radius:12px;padding:14px;background:var(--paper)}.v10-list h3{margin:4px 0}.v10-correct{color:#166a4b}.v10-missed{color:#b42318}body.dark .v10-correct{color:#a2efc8}body.dark .v10-missed{color:#ffb3bd}

const DATA=[{"subject":"Français","emoji":"📖","title":"Les figures de style","summary":"Les figures de style donnent plus de force aux textes.","points":["Comparaison : utilise un outil comme « comme ».","Métaphore : rapproche deux éléments sans outil de comparaison.","Personnification : donne une caractéristique humaine à un objet ou un animal.","Hyperbole : exagère une idée."],"q":[["« Il court comme le vent » est une…",["Comparaison","Métaphore","Hyperbole"],0,"« Comme » est un outil de comparaison."],["« La ville s’endort » est une…",["Personnification","Énumération","Comparaison"],0,"Une ville ne dort pas comme une personne."],["« Je t’ai appelé mille fois » est une…",["Hyperbole","Métaphore","Antithèse"],0,"L’expression exagère le nombre d’appels."]]},{"subject":"Français","emoji":"📖","title":"Classes grammaticales","summary":"La classe grammaticale indique la nature d’un mot.","points":["Nom : désigne un être, un objet ou une idée.","Déterminant : accompagne un nom.","Adjectif : apporte une précision sur le nom.","Verbe : exprime une action ou un état."],"q":[["Dans « les grands arbres », « grands » est…",["Un adjectif","Un verbe","Un pronom"],0,"« Grands » précise le nom « arbres »."],["Dans « elle chante », « elle » est…",["Un déterminant","Un pronom","Un nom"],1,"« Elle » remplace un nom ou un groupe nominal."],["Dans « un livre », « un » est…",["Un adjectif","Un déterminant","Un verbe"],1,"« Un » accompagne le nom « livre »."]]},{"subject":"Français","emoji":"📖","title":"Fonctions grammaticales","summary":"La fonction indique le rôle d’un mot ou groupe de mots dans la phrase.","points":["Sujet : indique de qui ou de quoi on parle.","COD : complète directement un verbe sans préposition.","COI : complète un verbe avec une préposition.","Complément circonstanciel : précise le lieu, le temps, la manière, etc."],"q":[["Dans « Léa mange une pomme », le COD est…",["Léa","mange","une pomme"],2,"Léa mange quoi ? Une pomme."],["Dans « Il parle à sa sœur », « à sa sœur » est…",["Un COI","Un sujet","Un COD"],0,"Le complément est introduit par « à »."],["Dans « Demain, nous partirons », « Demain » indique…",["Le lieu","Le temps","La cause"],1,"Il précise quand l’action aura lieu."]]},{"subject":"Français","emoji":"📖","title":"Temps du récit","summary":"Les temps verbaux aident à comprendre la chronologie d’un récit.","points":["Imparfait : description, habitude ou action en cours dans le passé.","Passé simple : action ponctuelle et achevée du récit.","Plus-que-parfait : action antérieure à une autre action passée."],"q":[["« Il marchait chaque jour » est à…",["L’imparfait","Au futur","Au passé simple"],0,"« Marchait » est à l’imparfait."],["« Elle entra dans la pièce » est au…",["Présent","Passé simple","Plus-que-parfait"],1,"« Entra » est au passé simple."],["« Il avait terminé » est au…",["Plus-que-parfait","Futur antérieur","Présent"],0,"Auxiliaire à l’imparfait + participe passé."]]},{"subject":"Français","emoji":"📖","title":"Comprendre un texte","summary":"Une réponse au brevet doit s’appuyer sur des indices précis.","points":["Lis la question avant de relire le passage.","Repère les mots importants et les personnages.","Justifie ta réponse avec un court élément du texte.","Distingue ce qui est écrit de ce que tu déduis."],"q":[["Pour justifier une réponse, il vaut mieux…",["Citer un indice du texte","Inventer un détail","Recopier tout le texte"],0,"Un indice précis permet de soutenir l’interprétation."],["Une information implicite est…",["Écrite mot pour mot","À déduire grâce aux indices","Toujours dans le titre"],1,"Il faut la déduire du texte."]]},{"subject":"Français","emoji":"📖","title":"Réussir une rédaction","summary":"Une rédaction claire suit un plan et respecte la consigne.","points":["Souligne les mots-clés de la consigne.","Prépare un plan : début, développement, fin.","Fais des paragraphes et utilise des connecteurs.","Relis les accords, la ponctuation et les temps."],"q":[["Avant de rédiger, il faut d’abord…",["Faire un plan","Écrire sans lire la consigne","Ignorer le sujet"],0,"Le plan aide à organiser les idées."],["Quel mot marque une opposition ?",["Ensuite","Cependant","D’abord"],1,"« Cependant » introduit une opposition."]]},{"subject":"Mathématiques","emoji":"📐","title":"Priorités opératoires","summary":"Les calculs suivent un ordre précis.","points":["Commence par les parenthèses.","Effectue ensuite multiplications et divisions.","Termine par additions et soustractions."],"q":[["3 + 4 × 2 =",["14","11","10"],1,"On calcule 4 × 2 = 8, puis 3 + 8 = 11."],["(3 + 4) × 2 =",["14","11","9"],0,"Parenthèses d’abord : 7 × 2 = 14."]]},{"subject":"Mathématiques","emoji":"📐","title":"Fractions","summary":"Une fraction représente un partage ou un quotient.","points":["Pour additionner deux fractions, utilise un dénominateur commun.","Pour multiplier, multiplie les numérateurs puis les dénominateurs.","Simplifier une fraction ne change pas sa valeur."],"q":[["1/2 + 1/4 =",["2/6","3/4","1/8"],1,"1/2 = 2/4 ; 2/4 + 1/4 = 3/4."],["2/3 × 3/4 =",["1/2","5/7","6/7"],0,"6/12 se simplifie en 1/2."]]},{"subject":"Mathématiques","emoji":"📐","title":"Équations","summary":"Résoudre une équation, c’est trouver la valeur de l’inconnue.","points":["Effectue la même opération des deux côtés.","Isole l’inconnue.","Vérifie en remplaçant l’inconnue dans l’équation de départ."],"q":[["x + 7 = 12, donc x =",["5","19","7"],0,"On soustrait 7 des deux côtés."],["3x = 18, donc x =",["15","6","54"],1,"On divise les deux côtés par 3."],["2x + 1 = 9, donc x =",["4","5","8"],0,"2x = 8 puis x = 4."]]},{"subject":"Mathématiques","emoji":"📐","title":"Théorème de Pythagore","summary":"Dans un triangle rectangle, on peut calculer une longueur.","points":["L’hypoténuse est en face de l’angle droit.","Si ABC est rectangle en A : BC² = AB² + AC².","Vérifie que le triangle est rectangle avant d’appliquer le théorème."],"q":[["Côtés de l’angle droit : 3 cm et 4 cm. Hypoténuse ?",["5 cm","7 cm","12 cm"],0,"3² + 4² = 25 ; racine carrée de 25 = 5."],["Dans un triangle rectangle, l’hypoténuse est…",["Le côté opposé à l’angle droit","Le côté le plus court","N’importe quel côté"],0,"Elle est en face de l’angle droit."]]},{"subject":"Mathématiques","emoji":"📐","title":"Pourcentages","summary":"Un pourcentage est une proportion exprimée sur 100.","points":["20 % = 20/100 = 0,20.","Pour calculer 20 % de 50 : 50 × 0,20.","Une hausse de 10 % revient à multiplier par 1,10."],"q":[["20 % de 80 =",["16","20","40"],0,"80 × 0,20 = 16."],["Un prix de 50 € augmente de 10 %. Nouveau prix ?",["55 €","60 €","45 €"],0,"10 % de 50 = 5, donc 55 €."]]},{"subject":"Mathématiques","emoji":"📐","title":"Statistiques et probabilités","summary":"Les données peuvent être résumées et les événements estimés.","points":["Moyenne : somme des valeurs ÷ nombre de valeurs.","Médiane : valeur centrale d’une série ordonnée.","Probabilité d’un événement : nombre de cas favorables ÷ nombre de cas possibles, si les issues sont équiprobables."],"q":[["Moyenne de 4, 6 et 8 =",["6","8","18"],0,"(4 + 6 + 8) ÷ 3 = 6."],["Sur un dé équilibré, probabilité d’obtenir 6 =",["1/2","1/6","1/3"],1,"Une face favorable sur six."]]},{"subject":"Histoire-géographie","emoji":"🌍","title":"Première Guerre mondiale","summary":"De 1914 à 1918, la guerre mobilise soldats et civils.","points":["1914-1918 : Première Guerre mondiale.","La guerre de tranchées marque le front occidental.","La bataille de Verdun a lieu en 1916.","11 novembre 1918 : armistice sur le front occidental."],"q":[["La Première Guerre mondiale commence en…",["1914","1939","1945"],0,"Le conflit débute en 1914."],["Verdun est une bataille de…",["1916","1940","1870"],0,"La bataille de Verdun a lieu en 1916."],["Le 11 novembre 1918 correspond à…",["Un armistice","La déclaration de guerre","La création de l’ONU"],0,"L’armistice met fin aux combats sur le front occidental."]]},{"subject":"Histoire-géographie","emoji":"🌍","title":"Les régimes totalitaires","summary":"Dans l’entre-deux-guerres, des dictatures imposent leur pouvoir.","points":["En URSS, Staline met en place un régime totalitaire.","En Allemagne, Hitler arrive au pouvoir en 1933.","Propagande, répression et culte du chef sont des caractéristiques de ces régimes."],"q":[["Hitler arrive au pouvoir en Allemagne en…",["1918","1933","1945"],1,"Hitler est nommé chancelier en janvier 1933."],["La propagande sert notamment à…",["Diffuser l’idéologie du régime","Organiser des élections libres","Garantir la liberté de la presse"],0,"Elle cherche à influencer la population."]]},{"subject":"Histoire-géographie","emoji":"🌍","title":"Seconde Guerre mondiale","summary":"Un conflit mondial de 1939 à 1945 marqué par des violences de masse.","points":["1939 : invasion de la Pologne par l’Allemagne nazie et début de la guerre en Europe.","1940 : défaite française, occupation et régime de Vichy.","La Shoah est le génocide des Juifs d’Europe par les nazis et leurs complices.","1945 : fin de la guerre."],"q":[["La Seconde Guerre mondiale se termine en…",["1918","1945","1962"],1,"La guerre se termine en 1945."],["Le régime de Vichy est dirigé par…",["Le maréchal Pétain","Jean Moulin","Charles de Gaulle"],0,"Pétain dirige l’État français à Vichy."],["La Shoah désigne…",["Le génocide des Juifs d’Europe","La libération de Paris","La construction européenne"],0,"C’est le génocide des Juifs d’Europe."]]},{"subject":"Histoire-géographie","emoji":"🌍","title":"La France depuis 1944","summary":"La République se reconstruit après la guerre.","points":["1944 : droit de vote accordé aux femmes en France.","1945 : création de la Sécurité sociale.","1958 : naissance de la Ve République.","1962 : élection du président de la République au suffrage universel direct approuvée par référendum."],"q":[["Les femmes obtiennent le droit de vote en France en…",["1789","1944","1981"],1,"Une ordonnance d’avril 1944 leur accorde ce droit."],["La Ve République débute en…",["1958","1945","1968"],0,"La Constitution de la Ve République date de 1958."]]},{"subject":"Histoire-géographie","emoji":"🌍","title":"Les aires urbaines françaises","summary":"Les villes organisent les activités et les déplacements.","points":["Une aire d’attraction d’une ville associe un pôle et une couronne.","La périurbanisation étend les espaces résidentiels autour des villes.","Les mobilités quotidiennes relient lieux d’habitation et lieux de travail."],"q":[["La périurbanisation correspond à…",["L’extension urbaine autour des villes","La disparition des transports","La baisse de toutes les populations urbaines"],0,"Les espaces résidentiels s’étendent en périphérie."],["Les déplacements domicile-travail sont des…",["Mobilités quotidiennes","Migrations internationales","Déplacements touristiques"],0,"Ils sont répétés fréquemment."]]},{"subject":"Histoire-géographie","emoji":"🌍","title":"Les espaces productifs","summary":"Les territoires français accueillent différentes activités économiques.","points":["Espace agricole : production issue de l’agriculture.","Espace industriel : fabrication et transformation.","Espace de services : commerces, transports, tourisme, etc.","Les activités se transforment sous l’effet de la mondialisation."],"q":[["Un espace de services est aussi appelé…",["Tertiaire","Primaire","Minier"],0,"Le secteur tertiaire regroupe les services."],["La fabrication de voitures relève surtout du secteur…",["Agricole","Industriel","Touristique"],1,"La production automobile est une activité industrielle."]]},{"subject":"Histoire-géographie","emoji":"🌍","title":"La France et l’Union européenne","summary":"La France appartient à un ensemble politique et économique européen.","points":["L’Union européenne rassemble des États membres qui coopèrent.","Le marché unique facilite la circulation des biens, des services, des capitaux et des personnes.","Tous les pays de l’Union européenne n’utilisent pas l’euro."],"q":[["Tous les pays de l’Union européenne utilisent-ils l’euro ?",["Oui","Non","Uniquement les plus grands"],1,"Certains États membres ont conservé leur monnaie."],["Le marché unique facilite notamment…",["La circulation des marchandises","La suppression des frontières du monde","La disparition des États"],0,"Il favorise les échanges au sein de l’Union."]]}];

let v9Text='',v9Title='',v9Subject='Français',v9Sentences=[],v9Quiz=[],v9Index=0,v9Score=0,v9Answered=false;
const v9Max=100000;
function v9Escape(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function v9Keywords(t){const stop=new Set('dans avec pour sont cette celui celle comme aussi leurs entre depuis avant après cette chaque ainsi leurs leurs toutes toute autres autre lequel laquelle même elles nous vous leur sans dont mais donc alors quand elle cette cette cours notre votre afin plus moins peut doit être avoir fait fait'.split(' '));let freq=new Map();(t.toLocaleLowerCase('fr').match(/[a-zà-ÿ][a-zà-ÿ'-]{4,}/g)||[]).forEach(w=>{if(!stop.has(w))freq.set(w,(freq.get(w)||0)+1)});return freq;}
function v9Create(t){v9Text=v9Clean(t).slice(0,v9Max);const all=v9Split(v9Text);if(all.length<3)return {error:'Le cours est trop court ou ne contient pas assez de phrases lisibles. Ajoute au moins trois phrases complètes.'};let freq=v9Keywords(v9Text);let scored=all.map((s,i)=>({s,i,score:(s.toLowerCase().match(/[a-zà-ÿ][a-zà-ÿ'-]{4,}/g)||[]).reduce((a,w)=>a+(freq.get(w)||0),0)/Math.max(6,s.length/35)+(i===0?1:0)}));let chosen=scored.slice().sort((a,b)=>b.score-a.score).slice(0,Math.min(8,all.length)).sort((a,b)=>a.i-b.i);v9Sentences=chosen.map(x=>x.s);
 const pool=(v9Text.match(/\b[A-ZÀ-Ÿ][a-zà-ÿ]{4,}\b/g)||[]).concat([...freq.entries()].filter(([w])=>w.length>=6).sort((a,b)=>b[1]-a[1]).map(([w])=>w));
 const unique=[...new Set(pool.map(w=>w.toLocaleLowerCase('fr')))];v9Quiz=[];
 for(const sentence of chosen){if(v9Quiz.length>=6)break;let words=(sentence.s.match(/[a-zà-ÿ][a-zà-ÿ'-]{5,}/gi)||[]).filter(w=>!['toujours','souvent','pendant','également','plusieurs','première','seconde','notamment','chaque','lorsque','autres','cette','celles','celui','leurs','entre'].includes(w.toLowerCase()));if(!words.length)continue;let answer=words.sort((a,b)=>(freq.get(b.toLowerCase())||0)-(freq.get(a.toLowerCase())||0))[0];let distractors=unique.filter(w=>w!==answer.toLowerCase() && w.length>=5 && !sentence.s.toLowerCase().includes(w)).slice(0,25);if(distractors.length<2)continue;let other=[distractors[(v9Quiz.length*3)%distractors.length],distractors[(v9Quiz.length*3+1)%distractors.length]];if(other[0]===other[1])continue;let opts=[answer,...other];let rot=v9Quiz.length%3;for(let j=0;j<rot;j++)opts.push(opts.shift());v9Quiz.push({masked:sentence.s.replace(answer,'_____'),sentence:sentence.s,answer,options:opts,correct:opts.indexOf(answer)});}

lector('#v9Info');status.textContent='Lecture du fichier…';try{const value=await v9ReadFile(f.files[0]);el.querySelector('#v9Text').value=v9Clean(value).slice(0,v9Max);if(!el.querySelector('#v9Title').value)el.querySelector('#v9Title').value=f.files[0].name.replace(/\.[^.]+$/,'');status.textContent=el.querySelector('#v9Text').value.length?'Texte récupéré. Vérifie-le, puis crée ta fiche.':'Aucun texte détecté. Le document est peut-être scanné.';}catch(err){status.textContent=err.message;}};el.querySelector('#v9Generate').onclick=()=>{v9Title=el.querySelector('#v9Title').value.trim()||'Mon cours';v9Subject=el.querySelector('#v9Subject').value;let r=v9Create(el.querySelector('#v9Text').value);if(r.error){el.querySelector('#v9Info').textContent=r.error;return;}page='v9Fiche';render();window.scrollTo(0,0)};return;}

 el.querySelector('#v10Next').onclick=()=>{v10Index++;if(v10Index>=x.questions.length){const old=v10Stats[v10Subject];v10Stats[v10Subject]={last:v10Score,best:Math.max(v10Score,old?.best||0),attempts:(old?.attempts||0)+1,missed:v10Mistakes.slice()};v10Save();page='v10Result';}render();window.scrollTo(0,0)};return;
 }
 if(page==='v10Result'){const x=V10_MORE[v10Subject];el.innerHTML=`<article class="panel"><h2>🌱 Bilan de mon entraînement</h2><p><strong>${v10Score} réponses justes sur ${x.questions.length}</strong></p>${v10Mistakes.length?`<h3>Mes points à retravailler</h3><div class="v10-list">${v10Mistakes.map(m=>`<article><strong>${v9Escape(m.topic)}</strong><p>${v9Escape(m.explanation)}</p></article>`).join('')}</div>`:'<p>Bravo, toutes les questions sont réussies !</p>'}<div class="actions"><button id="v10Again" class="primary">Recommencer</button><button id="v10Menu">Autre matière</button><button id="v10Home">Accueil</button></div></article>`;
 el.querySelector('#v10Again').onclick=()=>v10Start(v10Subject);el.querySelector('#v10Menu').onclick=()=>{page='v10Menu';render()};el.querySelector('#v10Home').onclick=()=>setPage('home');return;
 }
 if(page==='v10Share'){
 el.innerHTML=`<button id="v10Back">← Accueil</button><article class="panel"><h2>🔗 Espace enseignants · Partager une révision</h2><p>Crée un lien vers une fiche, un quiz ou un entraînement. Tu peux le coller dans une ressource itslearning, sans recopier les cours.</p><p class="v10-note"><strong>Sans connexion des plateformes :</strong> il s'agit de liens publics. Aucun compte, note ni résultat d'élève n'est transféré vers itslearning.</p><label class="v9-label" for="v10Select">Choisir une fiche</label><select id="v10Select" class="v9-input">${DATA.map((x,i)=>`<option value="${i}">${v9Escape(x.subject+' — '+x.title)}</option>`).join('')}</select><div class="actions"><button id="v10Fiche" class="primary">Copier le lien de la fiche</button><button id="v10Quiz">Copier le lien du quiz</button></div><h3>Partager un entraînement au brevet</h3><div class="v10-list">${Object.keys(V8_EXAMS).map(s=>`<article><strong>${v9Escape(s)}</strong><div class="actions"><button data-v10-v8="${v9Escape(s)}">Brevet approfondi (8 questions)</button><button data-v10-v10="${v9Escape(s)}">Nouvel entraînement (6 questions)</button></div></article>`).join('')}</div></article>`;
 el.querySelector('#v10Back').onclick=()=>setPage('home');el.querySelector('#v10Fiche').onclick=()=>v10Copy(v10Link('fiche',el.querySelector('#v10Select').value));el.querySelector('#v10Quiz').onclick=()=>v10Copy(v10Link('entrainement',el.querySelector('#v10Select').value));el.querySelectorAll('[data-v10-v8]').forEach(b=>b.onclick=()=>v10Copy(v10Link('brevet',b.dataset.v10V8)));el.querySelectorAll('[data-v10-v10]').forEach(b=>b.onclick=()=>v10Copy(v10Link('atelier',b.dataset.v10V10)));return;
 }
 if(page==='v10Review'){
 const v8Miss=Object.keys(V8_EXAMS).flatMap(s=>(v8History[s]?.missed||[]).map(x=>({...x,subject:s,from:'v8'})));
 const v10Miss=Object.keys(V10_MORE).flatMap(s=>(v10Stats[s]?.missed||[]).map(x=>({...x,subject:s,from:'v10'})));
 const all=[...v8Miss,...v10Miss];
 el.innerHTML=`<button id="v10Back">← Accueil</button><article class="panel"><h2>🎯 Mes notions à retravailler</h2><p>Cette liste utilise uniquement tes derniers résultats aux entraînements brevet sur cet appareil. Aucun résultat n'est envoyé à l'établissement.</p>${all.length?`<div class="v10-list">${all.map((m,i)=>`<article><p class="tag">${v9Escape(m.subject)}</p><h3>${v9Escape(m.topic)}</h3><p>${v9Escape(m.tip||m.explanation||'Relis la notion, puis entraîne-toi à nouveau.')}</p><button data-v10-review="${i}">M'entraîner dans cette matière →</button></article>`).join('')}</div>`:'<p>Tu n’as pas encore de points à revoir enregistrés. Essaie un entraînement au brevet pour obtenir un bilan.</p>'}</article>`;
 el.querySelector('#v10Back').onclick=()=>setPage('home');el.querySelectorAll('[data-v10-review]').forEach(b=>b.onclick=()=>{const m=all[Number(b.dataset.v10Review)];if(m.from==='v8')v8Start(m.subject);else v10Start(m.subject)});return;
 }
}
const v10PreviousRender=render;
render=function(){if(['v10Menu','v10Exercise','v10Result','v10Share','v10Review'].includes(page)){v10Render();return;}v10PreviousRender();
 if(page==='home'){
  const block=document.createElement('section');block.className='v10-callout';block.innerHTML='<p class="tag">Nouveautés · Version 10</p><h2>🎓 Je progresse vers le brevet</h2><p>Entraîne-toi sur de nouveaux documents, retrouve les notions à revoir ou partage directement une activité dans itslearning.</p><div class="actions"><button id="v10Open" class="primary">Nouveaux entraînements</button><button id="v10Review">Mes notions à retravailler</button><button id="v10Share">Espace enseignants · Partager un lien</button></div>';
  el.insertBefore(block,el.firstChild);block.querySelector('#v10Open').onclick=()=>{page='v10Menu';render()};block.querySelector('#v10Review').onclick=()=>{page='v10Review';render()};block.querySelector('#v10Share').onclick=()=>{page='v10Share';render()};
 }
 if(page==='progress'){
  const panel=document.createElement('section');panel.className='panel';panel.innerHTML='<h2>🎓 Mes nouveaux entraînements</h2><div class="grid">'+Object.keys(V10_MORE).map(s=>{const h=v10Stats[s];return `<article class="card"><h3>${v9Escape(s)}</h3><p>${h?`Dernier score : ${h.last}/6 · Meilleur : ${h.best}/6 · ${h.attempts} essai(s)`:'Pas encore essayé'}</p><button data-v10-progress="${v9Escape(s)}">${h?'Recommencer':'Commencer'}</button></article>`}).join('')+'</div><button id="v10SeeReview">Voir mes notions à retravailler</button>';
  el.appendChild(panel);el.querySelectorAll('[data-v10-progress]').forEach(b=>b.onclick=()=>v10Start(b.dataset.v10Progress));el.querySelector('#v10SeeReview').onclick=()=>{page='v10Review';render()};
 }
};
window.addEventListener('hashchange',v10OpenHash);
v10OpenHash();
if(!location.hash)render();

</script></body></html>
