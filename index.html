<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CERENE Révisions — Objectif Brevet</title><style>
:root{--bg:#f5f7fb;--paper:#fff;--ink:#203047;--muted:#526277;--accent:#6255b6;--border:#d9e2ee;--good:#166a4b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.65 Arial,sans-serif}body.dys{font-family:Verdana,Arial,sans-serif;letter-spacing:.07em;word-spacing:.16em;line-height:1.95}body.dark{--bg:#182434;--paper:#243348;--ink:#f5f7ff;--muted:#d4e0ee;--accent:#9acaff;--border:#52647c;--good:#a2efc8}body.large{font-size:21px}header{background:#f9f8ff;color:#303039;border-bottom:5px solid #9587dd;padding:22px max(20px,calc((100vw - 1050px)/2))}header h1{margin:0;font-size:1.8rem}header p{margin:0;color:#4c5266}main{max-width:1050px;margin:auto;padding:22px}nav,.toolbar,.actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}button{font:inherit;border:2px solid var(--border);border-radius:12px;padding:10px 15px;background:var(--paper);color:var(--ink);cursor:pointer}button:focus-visible{outline:4px solid #f0b744;outline-offset:2px}button.primary,.selected{background:var(--accent);color:#102034;border-color:var(--accent)}body:not(.dark) button.primary,body:not(.dark) .selected{color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px}.card,.panel{background:var(--paper);border:1px solid var(--border);border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 3px 12px #1020400b}.card h3{margin:0 0 7px}.card p{color:var(--muted)}.tag{font-size:.82em;color:var(--muted)}.question{font-weight:bold;font-size:1.15em}.answers{display:grid;gap:10px}.answers button{text-align:left}.feedback{padding:12px;border-left:5px solid var(--accent);margin-top:12px;background:var(--bg)}.hidden{display:none!important}footer{padding:25px;text-align:center;color:var(--muted)}progress{width:100%;height:20px;accent-color:#247b62}ul{padding-left:1.5em}li{margin:7px 0}#content{min-height:250px} .skip{position:absolute;left:-9999px}.skip:focus{left:10px;top:10px;background:white;padding:10px;z-index:10} @media(max-width:600px){header h1{font-size:1.45rem}main{padding:12px}.card,.panel{padding:16px}}
.brand{display:flex;align-items:center;gap:24px;flex-wrap:wrap}.brand-logo{display:block;width:190px;max-width:42vw;height:auto;object-fit:contain}body.dark header{background:#243348;color:#f5f7ff}body.dark header p{color:#d4e0ee}@media(max-width:600px){.brand{gap:12px}.brand-logo{width:145px}}
</style></head><body><a href="#content" class="skip">Aller au contenu</a><header><div class="brand"><img src="logo-cerene.png" alt="CERENE — Écoles passerelles dédiées aux DYS" class="brand-logo"><div><h1>Révisions 3e · Objectif Brevet</h1><p>À ton rythme, étape par étape</p></div></div></header><main><div class="toolbar" aria-label="Options d'accessibilité"><button id="dys" aria-pressed="false">Mode DYS</button><button id="size" aria-pressed="false">Agrandir le texte</button><button id="contrast" aria-pressed="false">Contraste renforcé</button><button id="read">🔊 Lire la page</button><button id="stop">⏹ Arrêter la lecture</button></div><nav aria-label="Navigation principale"><button id="home" class="primary">Accueil</button><button id="progress">Mes progrès</button></nav><section id="content" aria-live="polite"></section></main><footer>Un outil d'entraînement CERENE • Les exercices ne remplacent pas les cours des professeurs • Progrès enregistrés uniquement sur cet appareil</footer><script>
const DATA=[
{subject:'Français',emoji:'📖',title:'Les figures de style',summary:'Une figure de style rend une phrase plus expressive.',points:['Comparaison : rapproche deux éléments avec « comme », « tel » ou « semblable à ».','Métaphore : rapproche deux éléments sans mot de comparaison.','Personnification : attribue une action humaine à une chose ou un animal.'],q:[['« Il est rapide comme l’éclair » est…',['Une comparaison','Une métaphore','Une personnification'],0,'Le mot « comme » introduit la comparaison.'],['« Le vent murmure » est…',['Une hyperbole','Une personnification','Une comparaison'],1,'Le vent reçoit une action humaine : murmurer.'],['« Cet élève est un lion » est…',['Une métaphore','Une comparaison','Une énumération'],0,'Il n’y a pas de mot de comparaison.']]},
{subject:'Français',emoji:'📖',title:'Les classes grammaticales',summary:'La nature d’un mot indique ce qu’il est.',points:['Nom : désigne une personne, une chose ou une idée.','Verbe : exprime une action ou un état.','Adjectif : précise une caractéristique du nom.'],q:[['Dans « un grand arbre », « grand » est…',['Un verbe','Un adjectif','Un pronom'],1,'« Grand » donne une précision sur le nom « arbre ».'],['Dans « Elle court », « court » est…',['Un verbe','Un nom','Un déterminant'],0,'Il exprime une action.']]},
{subject:'Mathématiques',emoji:'📐',title:'Le théorème de Pythagore',summary:'Dans un triangle rectangle, le carré de l’hypoténuse est égal à la somme des carrés des deux autres côtés.',points:['Repère l’angle droit.','L’hypoténuse est le côté opposé à l’angle droit.','Si ABC est rectangle en A : BC² = AB² + AC².'],q:[['Triangle rectangle : côtés de l’angle droit 3 cm et 4 cm. Hypoténuse ?',['5 cm','7 cm','12 cm'],0,'3² + 4² = 9 + 16 = 25. La racine carrée de 25 vaut 5.'],['Quel côté est l’hypoténuse ?',['Le plus court','Celui opposé à l’angle droit','N’importe lequel'],1,'L’hypoténuse est toujours en face de l’angle droit.']]},
{subject:'Mathématiques',emoji:'📐',title:'Pourcentages',summary:'Un pourcentage représente une proportion sur 100.',points:['20 % signifie 20 sur 100.','Pour calculer 20 % de 50 : 50 × 20 ÷ 100.','Une hausse de 10 % multiplie le montant par 1,10.'],q:[['20 % de 50 =',['10','20','25'],0,'50 × 0,20 = 10.'],['50 € augmentés de 10 % donnent…',['55 €','60 €','45 €'],0,'10 % de 50 € = 5 €. Donc 50 + 5 = 55 €.']]},
{subject:'Histoire',emoji:'🏛️',title:'La Première Guerre mondiale',summary:'Un conflit mondial de 1914 à 1918.',points:['1914 : début de la guerre.','Les soldats connaissent la guerre de tranchées.','11 novembre 1918 : armistice sur le front occidental.'],q:[['La Première Guerre mondiale débute en…',['1914','1939','1789'],0,'Elle commence en 1914.'],['Que commémore le 11 novembre 1918 ?',['Le début du conflit','L’armistice','Le traité de Versailles'],1,'L’armistice met fin aux combats sur le front occidental.']]},
{subject:'Géographie',emoji:'🌍',title:'Les aires urbaines',summary:'Comprendre l’organisation et les déplacements dans les espaces urbains.',points:['Une aire d’attraction d’une ville comprend un pôle et une couronne.','La périurbanisation correspond à l’extension de l’habitat autour des villes.','Les déplacements domicile-travail relient souvent couronne et pôle.'],q:[['La périurbanisation désigne…',['L’extension de l’habitat autour des villes','La disparition des villes','La construction de ports'],0,'L’habitat se développe dans les espaces périphériques.']]},
{subject:'EMC',emoji:'⚖️',title:'Les valeurs de la République',summary:'Liberté, égalité et fraternité sont les valeurs de la République française.',points:['La liberté s’exerce dans le respect des droits d’autrui.','L’égalité signifie que les personnes ont les mêmes droits devant la loi.','La fraternité encourage la solidarité.'],q:[['Quelle est la devise de la République française ?',['Travail, famille, patrie','Liberté, Égalité, Fraternité','Unité, force, justice'],1,'La devise est « Liberté, Égalité, Fraternité ».']]},
{subject:'Sciences',emoji:'🔬',title:'ADN et information génétique',summary:'L’ADN porte une information génétique.',points:['L’ADN est présent dans les chromosomes.','Un gène est une portion d’ADN.','Les chromosomes se trouvent dans le noyau de la plupart des cellules humaines.'],q:[['Un gène est…',['Une portion d’ADN','Un organe','Une cellule entière'],0,'Un gène correspond à une portion d’ADN.']]},
{subject:'Sciences',emoji:'🔬',title:'Électricité : loi d’Ohm',summary:'La tension U, la résistance R et l’intensité I sont liées.',points:['Loi d’Ohm : U = R × I.','U se mesure en volts (V).','R se mesure en ohms (Ω) et I en ampères (A).'],q:[['Avec R = 4 Ω et I = 2 A, U vaut…',['2 V','6 V','8 V'],2,'U = R × I = 4 × 2 = 8 V.']]}
];
let page='home', current=0,step=0,score=0,answered=false;const el=document.getElementById('content');let results={};try{results=JSON.parse(localStorage.getItem('cerene-progress')||'{}')}catch{};
function save(){try{localStorage.setItem('cerene-progress',JSON.stringify(results))}catch{}}
function setPage(p){page=p;document.getElementById('home').classList.toggle('primary',p==='home');document.getElementById('progress').classList.toggle('primary',p==='progress');window.speechSynthesis?.cancel();render();}
function render(){if(page==='home'){let subjects=[...new Set(DATA.map(x=>x.subject))];el.innerHTML='<div class="panel"><h2>Bienvenue dans ton espace de révision 👋</h2><p>Choisis une matière, lis une petite fiche puis réponds aux questions. Tu peux recommencer autant de fois que tu veux.</p><p class="tag">Aucun compte nécessaire. Prends ton temps !</p></div><h2>Choisis ta matière</h2><div class="grid">'+subjects.map(s=>`<article class="card"><h3>${DATA.find(x=>x.subject===s).emoji} ${s}</h3><p>${DATA.filter(x=>x.subject===s).length} fiche(s) disponibles</p><button data-subject="${s}">Voir les fiches</button></article>`).join('')+'</div>';el.querySelectorAll('[data-subject]').forEach(b=>b.onclick=()=>{page='subject';subject=b.dataset.subject;render()})}else if(page==='subject'){el.innerHTML=`<button id="back">← Matières</button><h2>${subject}</h2><div class="grid">`+DATA.map((x,i)=>x.subject===subject?`<article class="card"><h3>${x.title}</h3><p>${x.summary}</p><p class="tag">${results[i]===undefined?'Pas encore essayé':'Meilleur score : '+results[i]+'/'+x.q.length}</p><button data-index="${i}">Réviser ce chapitre</button></article>`:'').join('')+'</div>';el.querySelector('#back').onclick=()=>setPage('home');el.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>{current=+b.dataset.index;page='lesson';render()})}else if(page==='lesson'){let x=DATA[current];el.innerHTML=`<button id="back">← Chapitres</button><article class="panel"><p class="tag">${x.subject} • Fiche de révision</p><h2>${x.title}</h2><p>${x.summary}</p><h3>À retenir</h3><ul>${x.points.map(t=>'<li>'+t+'</li>').join('')}</ul><button class="primary" id="start">Je m'entraîne →</button></article>`;el.querySelector('#back').onclick=()=>{page='subject';render()};el.querySelector('#start').onclick=()=>{step=0;score=0;page='quiz';render()}}else if(page==='quiz'){let x=DATA[current],q=x.q[step];el.innerHTML=`<button id="back">← Revoir la fiche</button><article class="panel"><p class="tag">Question ${step+1} sur ${x.q.length}</p><progress value="${step}" max="${x.q.length}" aria-label="Progression du quiz"></progress><h2 class="question">${q[0]}</h2><div class="answers">${q[1].map((a,i)=>`<button data-answer="${i}">${String.fromCharCode(65+i)}. ${a}</button>`).join('')}</div><div id="feedback" aria-live="polite"></div><button id="next" class="primary hidden">${step===x.q.length-1?'Voir mon résultat':'Question suivante →'}</button></article>`;answered=false;el.querySelector('#back').onclick=()=>{page='lesson';render()};el.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;let ok=+b.dataset.answer===q[2];if(ok)score++;el.querySelectorAll('[data-answer]').forEach(z=>{z.disabled=true;if(+z.dataset.answer===q[2])z.style.borderColor='var(--good)'});el.querySelector('#feedback').innerHTML=`<div class="feedback"><strong>${ok?'Bravo, bonne réponse !':'Pas encore, tu peux apprendre de cette question.'}</strong><p>Bonne réponse : ${q[1][q[2]]}.</p><p>${q[3]}</p></div>`;el.querySelector('#next').classList.remove('hidden')});el.querySelector('#next').onclick=()=>{step++;if(step>=x.q.length){results[current]=Math.max(results[current]||0,score);save();page='result'}render()}}else if(page==='result'){let x=DATA[current];el.innerHTML=`<article class="panel"><h2>🎉 Quiz terminé !</h2><p>Tu as obtenu <strong>${score} bonne(s) réponse(s) sur ${x.q.length}</strong>.</p><p>Chaque essai t'aide à progresser. Tu peux refaire ce quiz quand tu veux.</p><div class="actions"><button id="again" class="primary">Recommencer</button><button id="lesson">Relire la fiche</button><button id="all">Choisir une autre matière</button></div></article>`;el.querySelector('#again').onclick=()=>{step=0;score=0;page='quiz';render()};el.querySelector('#lesson').onclick=()=>{page='lesson';render()};el.querySelector('#all').onclick=()=>setPage('home')}else if(page==='progress'){let done=Object.keys(results).length;el.innerHTML=`<article class="panel"><h2>Mes progrès 🌱</h2><p><strong>${done} chapitre(s) essayé(s) sur ${DATA.length}</strong></p><progress value="${done}" max="${DATA.length}" aria-label="Chapitres essayés"></progress><p>Les meilleurs scores sont enregistrés sur cet appareil uniquement.</p><ul>${DATA.map((x,i)=>`<li>${x.subject} — ${x.title} : ${results[i]===undefined?'à découvrir':results[i]+'/'+x.q.length}</li>`).join('')}</ul><button id="reset">Effacer mes progrès sur cet appareil</button></article>`;el.querySelector('#reset').onclick=()=>{if(confirm('Effacer tous les scores enregistrés sur cet appareil ?')){results={};save();render()}}}}
let subject='Français';document.getElementById('home').onclick=()=>setPage('home');document.getElementById('progress').onclick=()=>setPage('progress');for(let [id,cls] of [['dys','dys'],['size','large'],['contrast','dark']])document.getElementById(id).onclick=()=>{let on=document.body.classList.toggle(cls);document.getElementById(id).setAttribute('aria-pressed',String(on))};document.getElementById('read').onclick=()=>{if(!('speechSynthesis'in window)){alert('Lecture vocale non disponible sur ce navigateur.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(el.innerText);u.lang='fr-FR';u.rate=.85;speechSynthesis.speak(u)};document.getElementById('stop').onclick=()=>window.speechSynthesis?.cancel();render();
</script></body></html>
